name: Build LuminaRead

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Launch the packaged JAR with a temporary library
        shell: pwsh
        run: |
          $artifact = Get-Item target/LuminaRead-2.0.0.jar
          $archive = [IO.Compression.ZipFile]::OpenRead($artifact.FullName)
          try {
            $notices = @('LICENSE', 'licenses/twelvemonkeys/LICENSE.txt',
              'licenses/twelvemonkeys/imageio-core.txt', 'licenses/twelvemonkeys/imageio-metadata.txt')
            foreach ($notice in $notices) {
              $entry = $archive.GetEntry("META-INF/$notice")
              if ($null -eq $entry) { throw "Missing license notice: $notice" }
              $stream = $entry.Open()
              try {
                $embeddedHash = (Get-FileHash -InputStream $stream).Hash
                $sourceHash = (Get-FileHash -LiteralPath $notice).Hash
                if ($embeddedHash -ne $sourceHash) { throw "Incorrect license notice: $notice" }
              } finally {
                $stream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
          }
          $profileDirectory = New-Item -ItemType Directory -Path (
            Join-Path ([IO.Path]::GetTempPath()) ("luminaread-check-" + [Guid]::NewGuid())
          )
          try {
            $javaArgs = @("-Duser.home=$($profileDirectory.FullName)", "-Djava.awt.headless=true", "-jar", $artifact.FullName)
            & java @javaArgs
            if ($LASTEXITCODE -ne 0) {
              throw "LuminaRead exited with status $LASTEXITCODE"
            }
            $books = @(Get-ChildItem (Join-Path $profileDirectory.FullName 'LuminaRead_Books') -Filter '*.fb2')
            if ($books.Count -eq 0) {
              throw 'The packaged application did not initialize the sample library'
            }
          } finally {
            Remove-Item -LiteralPath $profileDirectory.FullName -Recurse -Force
          }
      - name: Upload the tested desktop JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LuminaRead
          path: target/LuminaRead-2.0.0.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
